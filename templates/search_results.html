<h2>Search Results</h2>

{% if results %}
    <ul>
    {% for book in results %}
        <li>
            {{ book['title'] }} — {{ book['author'] }} — ISBN: {{ book['isbn'] }} — Qty: {{ book['quantity'] }}
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No matching books found.</p>
{% endif %}

<a href="/search">Back to Search</a>
